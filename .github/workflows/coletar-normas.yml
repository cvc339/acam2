name: Coletar normas (DOU + MG)

# Coleta diaria de normas dos Diarios Oficiais (Uniao + Minas Gerais).
# Cada fonte tem uma unica publicacao diaria, entao uma execucao por dia basta.
#
# Pre-requisitos:
#   - Secret CRON_SECRET configurado em "Settings > Secrets and variables > Actions"
#   - Mesma string como variavel de ambiente CRON_SECRET no Railway (acam.com.br)

on:
  schedule:
    - cron: '0 10 * * *'   # 07:00 BRT — DOU + MG
    - cron: '0 11 * * *'   # 08:00 BRT — DOU apenas (retry caso INLABS tenha caido as 07h)
    - cron: '0 12 * * *'   # 09:00 BRT — DOU apenas (segundo retry)
  workflow_dispatch:        # permite disparo manual pela UI do GitHub

concurrency:
  group: coletar-normas
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Coletar DOU
        # Tolera falhas transient do INLABS (governo). Se cair hoje, amanha roda de novo.
        continue-on-error: true
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 300 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.acam.com.br/api/admin/newsletter/coletar-dou

      - name: Coletar MG
        # So roda no primeiro horario do dia (07h BRT) ou em disparo manual.
        # MG raramente falha e e caro (puppeteer) — nao precisa de retries no mesmo dia.
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        # Janela de 10 dias (o padrao do endpoint era 7). Motivo, diagnostico de
        # 22/09/2026: a busca no CTL e por data de ASSINATURA, mas a norma so entra
        # no CTL depois de publicada no Diario. Defasagem medida nas fichas: RC
        # 3.420/2026 sete dias, RC 3.423/2026 cinco, RC 3.424/2026 seis. Com sete
        # dias a norma podia nunca ser coletada. Reinsercao e idempotente (23505).
        run: |
          DATA_FIM=$(date -u +%d/%m/%Y)
          DATA_INICIO=$(date -u -d "10 days ago" +%d/%m/%Y)
          echo "Coletando MG de $DATA_INICIO a $DATA_FIM"
          curl --fail-with-body --silent --show-error \
            --max-time 420 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"dataInicio\":\"$DATA_INICIO\",\"dataFim\":\"$DATA_FIM\"}" \
            https://www.acam.com.br/api/admin/newsletter/coletar-mg
